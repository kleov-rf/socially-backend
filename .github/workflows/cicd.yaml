name: Continuous Integration

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build image
    uses: ./.github/workflows/build.yaml
    with:
      artifact_name: socially-backend-jar

  push:
    name: Push image to ECR
    needs: [ build ]
    uses: ./.github/workflows/push.yaml
    with:
      artifact_name: socially-backend-jar
      image_tag: ${{ github.run_number }}-${{ github.run_attempt }}
      aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}

  deploy:
    name: Deploy to AWS
    needs: [ push ]
    uses: ./.github/workflows/deploy.yaml
    with:
      docker_image: ${{ needs.push.outputs.docker-image }}
      image_tag: ${{ github.run_number }}-${{ github.run_attempt }}
      aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}

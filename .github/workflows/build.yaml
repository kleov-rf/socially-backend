name: Build image

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
        description: "Name of the JAR artifact to upload"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew --no-daemon spotlessCheck bootJar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build/libs/*.jar
          retention-days: 1

name: _tests

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
        description: "Display name for the tests job"
      gradle_task:
        required: true
        type: string
        description: "Gradle task to execute (for example :app:test)"
      upload_jacoco:
        required: false
        type: boolean
        default: false
        description: "Upload JaCoCo XML artifact for downstream jobs"

jobs:
  tests:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Run Gradle tests
        run: ./gradlew --no-daemon --info ${{ inputs.gradle_task }}

      - name: Upload JaCoCo XML artifact
        if: ${{ inputs.upload_jacoco }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-jacoco-xml
          path: app/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 1

name: _tests

on:
  workflow_call:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Run Gradle integration tests (verbose logs)
        run: ./gradlew --no-daemon --console=plain --info :app:testIntegration

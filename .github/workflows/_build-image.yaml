name: _build-image

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Deployment environment (e.g., dev, stg, prd)"
    outputs:
      image_artifact_name:
        description: "Name of the uploaded image artifact"
        value: ${{ jobs.build.outputs.image_artifact_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_artifact_name: ${{ steps.image_artifact_metadata.outputs.artifact_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew --no-daemon spotlessCheck bootJar

      - name: Generate image artifact name
        id: image_artifact_metadata
        run: echo "artifact_name=image-${{ inputs.environment }}-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.image_artifact_metadata.outputs.artifact_name }}
          path: app/build/libs/*.jar
          retention-days: 1

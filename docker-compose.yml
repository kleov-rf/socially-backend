# Local development environment for Socially backend
# Run: docker compose up --build
#
# Backend: http://localhost:8080 (Spring Boot, API: /api/*)
# Postgres: localhost:5432 (for IDE connection if needed)

services:
  postgres:
    image: postgres:15-alpine
    container_name: socially-backend-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: socially
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: socially-backend-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: socially
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

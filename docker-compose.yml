# Local development environment for Socially backend
# Run: ./scripts/start-local.sh (recommended) or docker compose up --build
#
# Backend: http://localhost:8080 (Spring Boot, API: /api/*)
# RDS (MiniStack): localhost:15432 by default (see PRE-COMMIT / README)

services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: socially-ministack
    ports:
      - "4566:4566"
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      RDS_PERSIST: "0"
      RDS_BASE_PORT: "15432"
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O-", "http://127.0.0.1:4566/_ministack/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ministack-data:/tmp/ministack
      - ./scripts/ministack-init.sh:/docker-entrypoint-initaws.d/init.sh:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: socially-backend-app
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: local
      LOCAL_DB_HOST: ${LOCAL_DB_HOST:-}
      LOCAL_DB_PORT: ${LOCAL_DB_PORT:-}
      LOCAL_DB_NAME: ${LOCAL_DB_NAME:-}
      LOCAL_DB_USERNAME: ${LOCAL_DB_USERNAME:-}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-}
      LOCAL_COGNITO_HOSTED_DOMAIN: http://localhost:4566
      LOCAL_COGNITO_OAUTH_BASE_URL: http://ministack:4566
      LOCAL_COGNITO_REGION: us-east-1
      LOCAL_AUTH_REDIRECT_URI: http://localhost:5173/auth/callback/google
      LOCAL_COGNITO_USE_MINISTACK: "true"
      LOCAL_AUTH_COOKIES_SECURE: "false"
      LOCAL_COGNITO_IDENTITY_PROVIDER: ""
      LOCAL_COGNITO_USER_POOL_ID: ${LOCAL_COGNITO_USER_POOL_ID:-}
      LOCAL_COGNITO_ISSUER_URL: ${LOCAL_COGNITO_ISSUER_URL:-}
      LOCAL_COGNITO_SPA_CLIENT_ID: ${LOCAL_COGNITO_SPA_CLIENT_ID:-}
      LOCAL_COGNITO_BACKEND_CLIENT_ID: ${LOCAL_COGNITO_BACKEND_CLIENT_ID:-}
      LOCAL_COGNITO_BACKEND_CLIENT_SECRET_JSON: ${LOCAL_COGNITO_BACKEND_CLIENT_SECRET_JSON:-}
    depends_on:
      ministack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

volumes:
  ministack-data:

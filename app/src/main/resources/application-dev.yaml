spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URL}

media:
  storage:
    s3:
      bucket: ${MEDIA_STORAGE_S3_BUCKET}
      region: ${COGNITO_REGION}
    cdn:
      base-url: ${MEDIA_STORAGE_CDN_BASE_URL}
    presign:
      duration: PT5M

auth:
  redirect-uri: ${AUTH_REDIRECT_URI}
  cookies:
    secure: true
  oauth:
    region: ${COGNITO_REGION}
    user-pool-id: ${COGNITO_USER_POOL_ID}
    hosted-domain: ${COGNITO_HOSTED_DOMAIN}
    base-url: ${COGNITO_HOSTED_DOMAIN}
    identity-provider: Google
    credentials:
      spa:
        client-id: ${COGNITO_SPA_CLIENT_ID}
      backend:
        client-id: ${COGNITO_BACKEND_CLIENT_ID}
        client-secret-json: ${COGNITO_BACKEND_CLIENT_SECRET_JSON}
